name: Publicar Grand Line Wiki

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Extrair site
        run: |
          unzip -q Grand_Line_Wiki_9_3_DOWNLOAD.zip -d temp
          cp -a temp/Grand_Line_Wiki_7/. .
          rm -rf temp

      - name: Salvar arquivos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publicar Grand Line Wiki 7.1" || echo "Sem alterações"
          git push
